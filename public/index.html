{id:2,sc:2,col:10,client:'Gimnàs Vital',name:'Matrícula gratis',start:'15/10/2026',end:'14/11/2026',status:'Programado',pay:'Pagado',ad:G('MATRÍCULA GRATIS','Gimnàs Vital',1,'zoom')},
{id:3,sc:2,col:22,client:'Cafè Roca',name:'Desayuno 3,50 €',start:'09/10/2026',end:'08/11/2026',status:'Pendiente de aprobación',pay:'Pagado',ad:G('DESAYUNO 3,50 €','Cafè Roca',2,'fade')},
{id:4,sc:3,col:0,client:'Òptica Mirall',name:'Revisión gratis',start:'01/09/2026',end:'30/09/2026',status:'Finalizado',pay:'Pagado',ad:G('REVISIÓN GRATIS','Òptica Mirall',3)},
{id:5,sc:1,col:17,client:'Panadería Roca',name:'Pan recién hecho',start:'01/10/2026',end:'31/10/2026',status:'Activo',pay:'Pagado',ad:G('PAN RECIÉN HECHO','Panadería Roca',0,'fade')},

const OCC=['Activo','Programado','Pendiente de aprobación'],occ=b=>OCC.includes(b.status),bk=(sc,c)=>B.find(b=>b.sc==sc&&b.col==c&&occ(b)),scr=()=>screens.find(s=>s.id==S.sc);

for(let i=0;i<45;i++){const b=bk(sc.id,i);if(i%3==0)h+=`<em>min ${i/3}</em>`;h+=`<div class="c ${b?'busy':''} ${k==i?'sel':''}" ${b?'':`onclick="S.col=${i};R(1)"`}><b>20 s</b>${bt(i)}</div>`}

if(k!=null)h+=`<div class="card pad"><h3>Tu espacio publicitario</h3><dl><dt>Bloque seleccionado</dt><dd>minuto ${Math.floor(k/3)}, segundo ${k%3*20}</dd><dt>Duración</dt><dd>20 segundos</dd><dt>Frecuencia</dt><dd>cada 15 minutos</dd><dt>Repeticiones diarias</dt><dd>${n}</dd><dt>Precio</dt><dd>45 €/mes</dd></dl><div class=rep>${[0,1,2,3].map(i=>`<div><small>${pad(sc.open)}:${pad(i*15)}</small><span><i style="left:${k/45*100}%;animation-delay:${i*150}ms"></i></span></div>`).join('')}</div><p class=mut>Cada ciclo de 15 minutos se repite y tu bloque sale siempre en el mismo punto.</p><div class=chips>${sl.map(t=>`<span>${t}</span>`).join('')}</div><p class=hl>Tu anuncio aparecerá automáticamente en todos estos horarios.</p><p class=mut>No tendrás que seleccionar cada horario individualmente.</p></div><div class=sticky><button class="btn big" style="margin:0 auto;max-width:524px" onclick="go('ad')">CONTINUAR CON MI ANUNCIO</button></div>`;
return h}
if(S.step=='ad'){const a=S.ad;let h=`${back('block')}${bar(3)}<h2>Crea o sube tu anuncio</h2><div class=two><button class="opt ${S.tab=='up'?'on':''}" onclick="S.tab='up';R(1)"><b>SUBIR MI ANUNCIO</b><small>JPG, PNG o MP4</small></button><button class="opt ${S.tab=='ai'?'on':''}" onclick="S.tab='ai';R(1)"><b>CREAR MI ANUNCIO CON IA</b><small>Propuestas listas</small></button></div>`;
if(S.tab=='up')h+=`<label class="btn big" style="cursor:pointer">SUBIR IMAGEN O VÍDEO<input type=file hidden accept="image/jpeg,image/png,video/mp4" onchange="upl(this.files[0])"></label><p class=mut style="margin-top:6px">JPG, PNG o MP4. Vídeo de máximo 20 segundos.</p>${S.warn?`<div class=warn>${S.warn.msg}<br><button class=btn onclick="fix()">${S.warn.fix}</button></div>`:''}`;
else{const f=S.f||{},i=(k,l)=>`<label>${l}<input id=f_${k} value="${E(f[k]||'')}"></label>`;h+=`<div class=form>${i('biz','Nombre del negocio')}${i('what','Qué quieres anunciar')}${i('text','Texto principal')}${i('tel','Teléfono')}${i('web','Web')}${i('addr','Dirección')}<label>Logo<input type=file accept="image/*" onchange="S.logo=this.files[0]?URL.createObjectURL(this.files[0]):null"></label><label>Estilo visual<select id=f_style>${['Moderno','Elegante','Divertido','Impactante'].map(s=>`<option ${f.style==s?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn big" style="margin:0" onclick="gen()">GENERAR PROPUESTAS</button></div>`;
if(S.props)h+=`<h3>Elige una propuesta</h3><div class=props>${S.props.map((p,i)=>`<button class="prop ${a&&a.pi===i?'on':''}" onclick="S.ad={...S.props[${i}]};R(1)">${led(p)}</button>`).join('')}</div>`;
if(a&&a.k=='gen')h+=`<div class=form style="margin-top:12px"><label>Texto<input value="${E(a.text)}" oninput="ed('text',this.value)"></label><label>Subtítulo<input value="${E(a.sub)}" oninput="ed('sub',this.value)"></label><div class=sw2>${TPL.map((t,k)=>`<button aria-label="Color ${k+1}" style="background:${t.bg}" onclick="ed('tpl',${k})"></button>`).join('')}</div><label>Tipografía<select onchange="ed('font',this.value)">${['Bricolage Grotesque','Georgia','Hanken Grotesk','Courier New'].map(x=>`<option ${a.font==x?'selected':''}>${x}</option>`).join('')}</select></label><label>Distribución<select onchange="ed('lay',this.value)"><option value=c ${a.lay!='left'?'selected':''}>Centrado</option><option value=left ${a.lay=='left'?'selected':''}>A la izquierda</option></select></label><label>Animación<select onchange="ed('anim',this.value)">${[['slide','Deslizar'],['zoom','Zoom'],['fade','Parpadeo'],['none','Ninguna']].map(x=>`<option value=${x[0]} ${a.anim==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label></div>`}
if(a)h+=`<h3 style="margin-top:14px">Así se verá tu anuncio en la pantalla.</h3><div id=pv style="margin-top:8px">${led(a)}</div><div class=sticky><button class="btn big" style="margin:0 auto;max-width:524px" ${S.warn?'disabled':''} onclick="go('sum')">UTILIZAR ESTE ANUNCIO</button></div>`;
return h}
if(S.step=='sum'){const p=per();return`${back('ad')}${bar(4)}<h2>Tu publicidad está lista</h2><div class="card pad"><dl><dt>Pantalla</dt><dd>${E(sc.name)}</dd><dt>Espacio</dt><dd>20 segundos · bloque ${bt(S.col)}</dd><dt>Frecuencia</dt><dd>Cada 15 minutos</dd><dt>Duración</dt><dd>1 mes</dd><dt>Repeticiones</dt><dd>${n} al día · ≈ ${n*p.d} en el mes</dd><dt>Precio</dt><dd>45 €/mes</dd></dl><small>Anuncio</small>${led(S.ad)}</div><div class=sticky><button class="btn big" style="margin:0 auto;max-width:524px" onclick="pay()">CONTRATAR POR 45 €/MES</button></div>`}
const b=S.last,s2=screens.find(s=>s.id==b.sc),l=rep(s2,b.col),n2=l.length;return`<div class=ok>✓</div><h2>¡Tu publicidad está reservada!</h2><p class=mut>El propietario revisará tu anuncio antes de la fecha de inicio.</p><div class="card pad"><dl><dt>Pantalla</dt><dd>${E(s2.name)}</dd><dt>Inicio</dt><dd>${b.start}</dd><dt>Fin</dt><dd>${b.end}</dd><dt>Bloque</dt><dd>${bt(b.col)} del ciclo</dd><dt>Horarios</dt><dd>cada 15 min, ${l[0]}–${l[n2-1]}</dd><dt>Reproducciones</dt><dd>≈ ${n2*per().d}</dd></dl>${led(b.ad)}</div><button class="btn big" onclick="S.ad=null;S.props=null;S.col=null;go('home')">VOLVER AL INICIO</button>`}
function upl(f){if(!f)return;S.warn=null;S.fixTab=0;const src=URL.createObjectURL(f);
if(!['image/jpeg','image/png','video/mp4'].includes(f.type)){S.ad=null;S.fixTab=1;S.warn={msg:'⚠ Formato no admitido. Usa JPG, PNG o MP4.',fix:'Crear mi anuncio con IA'};return R(1)}
if(f.type[0]=='v'){const v=document.createElement('video');v.onloadedmetadata=()=>{S.ad={k:'vid',src,name:f.name};if(v.duration>20.5)S.warn={msg:`⚠ Tu vídeo dura ${Math.round(v.duration)} s y el máximo es 20 s.`,fix:'Recortar automáticamente a 20 s'};R(1)};v.src=src}
else{const i=new Image();i.onload=()=>{S.ad={k:'img',src,name:f.name};if(Math.abs(i.width/i.height-16/9)>.15)S.warn={msg:'⚠ Tu imagen no es panorámica (16:9) y se vería recortada.',fix:'Ajustar al formato de la pantalla'};R(1)};i.src=src}}
function fix(){if(S.fixTab){S.tab='ai';S.fixTab=0}S.warn=null;R(1)}
function gen(){const g=k=>$('#f_'+k).value.trim(),f=S.f={biz:g('biz'),what:g('what'),text:g('text'),tel:g('tel'),web:g('web'),addr:g('addr'),style:g('style')};
const base={Moderno:0,Elegante:3,Divertido:1,Impactante:2}[f.style],sub=[f.biz,f.tel,f.web,f.addr].filter(Boolean).join(' | ')||'Tu negocio',t=f.text||f.what||f.biz||'Tu mensaje aquí',fo={Moderno:'Bricolage Grotesque',Elegante:'Georgia',Divertido:'Hanken Grotesk',Impactante:'Courier New'}[f.style];
S.props=[0,1,2].map(i=>({k:'gen',tpl:(base+i)%4,text:i==1&&f.what&&f.text?f.what:t,sub,anim:['slide','zoom','fade'][i],font:fo,lay:i==1?'left':'c',logo:S.logo,pi:i}));S.ad=null;R(1)}
function ed(k,v){S.ad[k]=v;S.ad.pi=undefined;$('#pv').innerHTML=led(S.ad)}
function pay(){const p=per();S.last={id:Date.now(),sc:S.sc,col:S.col,client:(S.f&&S.f.biz)||'Tu negocio',name:S.ad.text||S.ad.name||'Mi anuncio',start:fd(p.s),end:fd(p.e),status:'Pendiente de aprobación',pay:'Pagado',ad:S.ad};B.push(S.last);go('done')}
/* ---- OWNER ---- */
const NAV=[['dash','Dashboard'],['screens','Pantallas'],['res','Reservas'],['ads','Anuncios'],['cli','Clientes']];
function oView(){if(!S.login)return`<div class=card style="max-width:380px;margin:50px auto" ><div class=pad><h2>Acceso propietarios</h2><div class=form><label>Email<input id=em type=email></label><label>Contraseña<input id=pw type=password></label><button class="btn big" style="margin:0" onclick="if($('#em').value&&$('#pw').value){S.login=true;R()}">ENTRAR</button><small>Demo: escribe cualquier email y contraseña.</small></div></div></div>`;
return`<div class=oshell><nav class=side>${NAV.map(n=>`<button class="${S.view==n[0]?'on':''}" onclick="S.view='${n[0]}';R()">${n[1]}</button>`).join('')}</nav><main>${ov()}</main></div>`}
function ov(){const act=screens.filter(s=>s.active),v=S.view;
if(v=='dash'){const tot=act.length*45,oc=B.filter(b=>occ(b)&&act.some(s=>s.id==b.sc)).length,inc=B.filter(b=>['Activo','Programado'].includes(b.status)).length*45;
return`<h2>Dashboard</h2><div class=kpis><div class=kpi><small>Pantallas activas</small><b>${act.length}</b></div><div class=kpi><small>Bloques ocupados</small><b>${oc}</b></div><div class=kpi><small>Bloques disponibles</small><b>${tot-oc}</b></div><div class="kpi hi"><small style="color:#b9c3d8">Ingresos mensuales</small><b>${inc} €</b></div></div>
<h3 style="margin:22px 0 8px">Próximas reservas</h3><div class=card><div class=tw><table>${B.filter(b=>['Programado','Pendiente de aprobación'].includes(b.status)).map(b=>`<tr><td><b>${E(b.client)}</b></td><td>${E(b.name)}</td><td>${E(screens.find(s=>s.id==b.sc).name)}</td><td>Bloque ${bt(b.col)}</td><td>${b.start}</td><td>${stc(b.status)}</td></tr>`).join('')||'<tr><td>Sin reservas próximas</td></tr>'}</table></div></div>`}
if(v=='screens')return`<div class=row><h2>Pantallas</h2><button class=btn onclick="S.modal={t:'scr',id:0};R(1)">+ Añadir pantalla</button></div><div class=grid>${screens.map(s=>{const u=B.filter(b=>b.sc==s.id&&occ(b)).length;return`<article class=card style="margin:0;${s.active?'':'opacity:.65'}">${photo(s)}<div class=pad><h3>${E(s.name)}</h3><p class=mut>${E(s.zone)} · ${pad(s.open)}:00–${pad(s.close)}:00</p><p><b>${u}/45</b> bloques ocupados</p><div class=row style="margin-top:10px"><button class="tg ${s.active?'on':''}" onclick="tgS(${s.id})"><i></i>${s.active?'Activa':'Inactiva'}</button><span><button class=btn onclick="S.modal={t:'scr',id:${s.id}};R(1)">Editar</button> <button class=btn onclick="S.osc=${s.id};S.view='res';R()">Ver reservas</button></span></div></div></article>`}).join('')}</div>`;
if(v=='res'){const sc=screens.find(s=>s.id==S.osc);return`<div class=row><h2>Reservas</h2><select style="width:auto" onchange="S.osc=+this.value;R(1)">${screens.map(s=>`<option value=${s.id} ${s.id==S.osc?'selected':''}>${E(s.name)}</option>`).join('')}</select></div><p class=mut>Ciclo de 15 minutos: 15 min × 3 bloques de 20 s = 45 bloques, repetido de ${pad(sc.open)}:00 a ${pad(sc.close)}:00.</p><div class=tw><div class=omx style="margin-top:10px"><div></div><b>0–20 s</b><b>20–40 s</b><b>40–60 s</b>${Array.from({length:45},(_,k)=>(k%3?'':`<b style="font-size:.78rem">min ${k/3}</b>`)+(b=>b?`<div class="oc r" onclick="S.modal={t:'bk',id:${b.id}};R(1)"><b>${E(b.client)}</b>${E(b.name)}<br>${b.start.slice(0,5)}–${b.end.slice(0,5)}<br>${bt(k)}</div>`:`<div class="oc f">Libre<br>${bt(k)}</div>`)(bk(sc.id,k))).join('')}</div></div>`}
if(v=='ads')return`<h2>Anuncios</h2><div class=grid>${B.map(b=>`<article class=card style="margin:0"><div style="padding:10px 10px 0">${led(b.ad)}</div><div class=pad><div class=row><b>${E(b.client)}</b>${stc(b.status)}</div><small>${E(b.name)} · ${E(screens.find(s=>s.id==b.sc).name)}<br>Bloque ${bt(b.col)} · 20 s · ${b.start}–${b.end}</small>${b.reason?`<p style="color:#c0162f;font-size:.85rem">Motivo: ${E(b.reason)}</p>`:''}${b.status=='Pendiente de aprobación'?`<div style="margin-top:8px"><button class=btn onclick="appr(${b.id})">APROBAR</button> <button class=btn onclick="S.modal={t:'rej',id:${b.id}};R(1)">RECHAZAR</button></div>`:''}</div></article>`).join('')}</div>`;
const row=b=>`<tr><td><b>${E(b.client)}</b></td><td>${E(b.name)}</td><td>${E(screens.find(s=>s.id==b.sc).name)}</td><td>${b.start}</td><td>${b.end}</td><td>${b.pay}</td><td>${stc(b.status)}</td></tr>`,tb=l=>`<div class=card><div class=tw><table><tr><th>Cliente</th><th>Campaña</th><th>Pantalla</th><th>Inicio</th><th>Fin</th><th>Pago</th><th>Estado</th></tr>${l.map(row).join('')||'<tr><td>Ninguno</td></tr>'}</table></div></div>`;
return`<h2>Clientes</h2><h3>Clientes activos</h3>${tb(B.filter(occ))}<h3>Clientes anteriores</h3>${tb(B.filter(b=>!occ(b)))}`}
const tgS=id=>{const s=screens.find(x=>x.id==id);s.active=!s.active;R(1)},cl=()=>{S.modal=null;R(1)};
function appr(id){const b=B.find(x=>x.id==id);b.status=pd(b.start)<=new Date()?'Activo':'Programado';S.modal=null;R(1)}
function rej(id){const b=B.find(x=>x.id==id);b.status='Rechazado';b.reason=$('#rs').value||'Sin motivo indicado';S.modal=null;R(1)}
function saveS(id){let s=id?screens.find(x=>x.id==id):{id:Date.now(),active:true,hue:Math.floor(Math.random()*360)};s.name=$('#sn').value||'Nueva pantalla';s.zone=$('#sz').value||'Zona';s.open=+$('#so').value;s.close=Math.max(+$('#sc').value,s.open+1);if(S.tmp)s.photo=S.tmp;S.tmp=null;if(!id)screens.push(s);S.modal=null;R(1)}
function modal(){const m=S.modal;if(!m)return'';let h='';
if(m.t=='scr'){const s=screens.find(x=>x.id==m.id)||{name:'',zone:'',open:6,close:23};h=`<h3>${m.id?'Editar':'Añadir'} pantalla</h3><div class=form><label>Nombre<input id=sn value="${E(s.name)}"></label><label>Ubicación<input id=sz value="${E(s.zone)}"></label><label>Abre (hora)<input id=so type=number min=0 max=23 value=${s.open}></label><label>Cierra (hora)<input id=sc type=number min=1 max=24 value=${s.close}></label><label>Fotografía<input type=file accept="image/*" onchange="S.tmp=URL.createObjectURL(this.files[0])"></label></div><button class=btn onclick="saveS(${m.id})">Guardar</button><button class=btn onclick="cl()">Cancelar</button>`}
else{const b=B.find(x=>x.id==m.id);if(m.t=='rej')h=`<h3>Rechazar anuncio de ${E(b.client)}</h3><div class=form><label>Motivo<textarea id=rs rows=3></textarea></label></div><button class=btn onclick="rej(${b.id})">Rechazar anuncio</button><button class=btn onclick="cl()">Cancelar</button>`;
else h=`<h3>Detalle de la reserva</h3><dl><dt>Cliente</dt><dd>${E(b.client)}</dd><dt>Publicidad</dt><dd>${E(b.name)}</dd><dt>Bloque</dt><dd>${bt(b.col)} del ciclo</dd><dt>Duración</dt><dd>20 segundos</dd><dt>Frecuencia</dt><dd>cada 15 minutos</dd><dt>Inicio</dt><dd>${b.start}</dd><dt>Fin</dt><dd>${b.end}</dd><dt>Estado</dt><dd>${b.status}</dd><dt>Archivo</dt><dd>${E(b.ad.name||'anuncio-'+b.id+'.mp4')}</dd></dl>${led(b.ad)}${b.status=='Pendiente de aprobación'?`<button class=btn onclick="appr(${b.id})">APROBAR</button><button class=btn onclick="S.modal={t:'rej',id:${b.id}};R(1)">RECHAZAR</button>`:''}<button class=btn onclick="cl()">Cerrar</button>`}
return`<div class=ov onclick="if(event.target==this)cl()"><div class=mdl role=dialog>${h}</div></div>`}
R();
</script></body></html>
